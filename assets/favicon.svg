<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#19386c" />
      <stop offset="60%" stop-color="#0a1a36" />
      <stop offset="100%" stop-color="#040b17" />
    </radialGradient>
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5da7d" />
      <stop offset="50%" stop-color="#c38b25" />
      <stop offset="100%" stop-color="#e8b550" />
    </linearGradient>
    <radialGradient id="ballSheen" cx="38%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="25%" stop-color="#d4dde6" stop-opacity="0.85" />
      <stop offset="65%" stop-color="#4a5563" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#151b22" stop-opacity="1" />
    </radialGradient>
    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff8db" />
      <stop offset="100%" stop-color="#e8b550" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Full-bleed background canvas -->
  <rect width="512" height="512" fill="url(#bgGlow)" />

  <!-- Ball Glow Ambient -->
  <circle cx="256" cy="220" r="148" fill="#e8b550" opacity="0.12" filter="blur(16px)" />

  <!-- Trophy Stand Column -->
  <polygon points="234,310 278,310 290,388 222,388" fill="#c38b25" stroke="#7a5210" stroke-width="3" />
  <!-- Trophy Stand Pedestal -->
  <rect x="190" y="385" width="132" height="22" rx="6" fill="#e8b550" stroke="#8a5c0f" stroke-width="3" />

  <!-- Mirrorball Base -->
  <circle cx="256" cy="220" r="126" fill="url(#ballSheen)" stroke="#e8b550" stroke-width="5" />

  <!-- Disco Facets Overlay Grid -->
  <g stroke="#1a222a" stroke-width="2" opacity="0.82">
    <!-- Horizontal rings -->
    <ellipse cx="256" cy="140" rx="92" ry="16" fill="none" stroke="#2c3742" />
    <ellipse cx="256" cy="175" rx="116" ry="22" fill="none" stroke="#2c3742" />
    <ellipse cx="256" cy="220" rx="126" ry="26" fill="none" stroke="#2c3742" />
    <ellipse cx="256" cy="265" rx="116" ry="22" fill="none" stroke="#2c3742" />
    <ellipse cx="256" cy="300" rx="92" ry="16" fill="none" stroke="#2c3742" />

    <!-- Vertical facet meridians -->
    <path d="M 256,94 Q 256,220 256,346" stroke="#4a5563" />
    <path d="M 256,94 Q 220,220 220,344" stroke="#4a5563" />
    <path d="M 256,94 Q 292,220 292,344" stroke="#4a5563" />
    <path d="M 256,94 Q 180,220 186,334" stroke="#4a5563" />
    <path d="M 256,94 Q 332,220 326,334" stroke="#4a5563" />
    <path d="M 256,94 Q 146,220 160,314" stroke="#4a5563" />
    <path d="M 256,94 Q 366,220 352,314" stroke="#4a5563" />
  </g>

  <!-- Sparkle highlights on facets -->
  <rect x="226" y="152" width="24" height="18" fill="#ffffff" opacity="0.85" rx="2" />
  <rect x="254" y="174" width="28" height="20" fill="#fdf3cd" opacity="0.9" rx="2" />
  <rect x="198" y="176" width="22" height="18" fill="#e8b550" opacity="0.8" rx="2" />
  <rect x="232" y="198" width="26" height="20" fill="#ffffff" opacity="0.95" rx="2" />
  <rect x="288" y="200" width="24" height="20" fill="#ffffff" opacity="0.75" rx="2" />
  <rect x="206" y="222" width="22" height="18" fill="#d8e5f2" opacity="0.7" rx="2" />

  <!-- Specular Crescent Sheen -->
  <path d="M 160,165 A 118,118 0 0,1 310,120" stroke="#ffffff" stroke-width="7" stroke-linecap="round" fill="none" opacity="0.75" />

  <!-- Sparkling 4-point Stars -->
  <!-- Top Left Star -->
  <g transform="translate(138, 128)">
    <path d="M 0,-26 Q 2,-4 26,0 Q 2,4 0,26 Q -2,4 -26,0 Q -2,-4 0,-26 Z" fill="#fff9e6" />
    <circle cx="0" cy="0" r="4" fill="#ffffff" />
  </g>
  <!-- Top Right Star -->
  <g transform="translate(378, 150)">
    <path d="M 0,-32 Q 3,-5 32,0 Q 3,5 0,32 Q -3,5 -32,0 Q -3,-5 0,-32 Z" fill="#ffe082" />
    <circle cx="0" cy="0" r="5" fill="#ffffff" />
  </g>
  <!-- Lower Right Star -->
  <g transform="translate(362, 290)">
    <path d="M 0,-20 Q 2,-3 20,0 Q 2,3 0,20 Q -2,3 -20,0 Q -2,-3 0,-20 Z" fill="#ffd54f" />
    <circle cx="0" cy="0" r="3" fill="#ffffff" />
  </g>
  <!-- Lower Left Star -->
  <g transform="translate(142, 280)">
    <path d="M 0,-18 Q 2,-3 18,0 Q 2,3 0,18 Q -2,3 -18,0 Q -2,-3 0,-18 Z" fill="#ffffff" />
    <circle cx="0" cy="0" r="3" fill="#ffffff" />
  </g>

  <!-- Banner: DWTS 35 -->
  <rect x="144" y="420" width="224" height="48" rx="24" fill="#121518" stroke="#e8b550" stroke-width="4" />
  <text x="256" y="453" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'IBM Plex Sans', 'Arial Black', sans-serif" font-weight="900" font-size="26" fill="#f5da7d" letter-spacing="2">DWTS 35</text>
</svg>
