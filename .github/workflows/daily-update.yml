name: DWTS Daily & Live Show Update

on:
  schedule:
    # 1. Tuesday Night Live Window: Every 15 minutes between 8:00 PM and 11:59 PM ET
    # (00:00 UTC to 04:59 UTC Wednesday to support both EDT and EST)
    - cron: '*/15 0-4 * * 3'

    # 2. Daily Check: Every night at 11:00 PM ET (03:00 UTC / 04:00 UTC)
    # for songs, theme updates, and market shifts
    - cron: '0 3 * * *'
    - cron: '0 4 * * *'

  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

concurrency:
  group: dwts-update
  cancel-in-progress: true

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run DWTS Daily & Market Updater
        run: |
          python3 scripts/update_cheat_sheet.py

      - name: Validate Formatting
        run: |
          python3 scripts/validate_cheat_sheet.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html dancers.json dancers.txt
          if git diff --staged --quiet; then
            echo "No changes detected. Everything is up to date."
          else
            git commit -m "chore(update): refresh DWTS scores, songs, eliminations & market data"
            git push origin main
          fi
