name: DWTS Daily Update

on:
  schedule:
    # 11:00 PM EDT (03:00 UTC) during Daylight Saving Time
    - cron: '0 3 * * *'
    # 11:00 PM EST (04:00 UTC) during Standard Time
    - cron: '0 4 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

concurrency:
  group: dwts-update
  cancel-in-progress: true

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run DWTS Daily Updater
        run: |
          python3 scripts/update_cheat_sheet.py

      - name: Validate Formatting
        run: |
          python3 scripts/validate_cheat_sheet.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html dancers.json dancers.txt
          if git diff --staged --quiet; then
            echo "No changes detected. Everything is up to date."
          else
            git commit -m "chore(daily-update): update scores, songs, and eliminations"
            git push origin main
          fi
