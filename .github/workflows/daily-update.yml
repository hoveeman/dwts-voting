name: DWTS Nightly Update
 
on:
  schedule:
    # Nightly Check: Every night at ~11:15 PM ET (03:15 UTC for EDT / 04:15 UTC for EST)
    # Using off-minute (:15) avoids severe GitHub Actions queue delays at the top of the hour (:00)
    - cron: '15 3 * * *'
    - cron: '15 4 * * *'

  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

concurrency:
  group: dwts-update
  cancel-in-progress: true

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install pillow

      - name: Run DWTS Daily & Market Updater
        env:
          SPOTIPY_CLIENT_ID: ${{ secrets.SPOTIPY_CLIENT_ID }}
          SPOTIPY_CLIENT_SECRET: ${{ secrets.SPOTIPY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
        run: |
          python3 scripts/update_cheat_sheet.py

      - name: Validate Formatting
        run: |
          python3 scripts/validate_cheat_sheet.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html dancers.json dancers.txt spotify_playlists.json spotify_tracks.json assets/playlist_covers/
          if git diff --staged --quiet; then
            echo "No changes detected. Everything is up to date."
          else
            git commit -m "chore(update): refresh DWTS scores, songs, eliminations, market data & Spotify playlists"
            git push origin main
          fi
